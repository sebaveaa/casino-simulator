name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: casino
          POSTGRES_PASSWORD: casino
          POSTGRES_DB: casino
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casino -d casino"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run migrate
        env:
          DATABASE_URL: postgres://casino:casino@localhost:5432/casino
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://casino:casino@localhost:5432/casino
          TEST_REDIS_URL: redis://localhost:6379
