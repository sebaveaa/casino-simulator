name: Task
description: A unit of work with clear scope and acceptance criteria.
labels: ["type:task"]
body:
  - type: markdown
    attributes:
      value: |
        The rules in `AGENTS.md` apply to every task. Multi-step work gets a task file under `odd/tasks/` before the first code change.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The part of the system this task mainly touches.
      options:
        - Auth & security
        - Wallet / Ledger
        - Games & RNG
        - Worker & realtime
        - Frontend & rendering
        - Infra, CI/CD & observability
        - Docs & repo
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What outcome the task delivers, and why it matters.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links to README sections, related issues, or designs.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope and what is explicitly out of scope.
      value: |
        In scope:
        Out of scope:
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that mean the task is done.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues that must land first, as `#N`.
    validations:
      required: false
  - type: textarea
    id: checks
    attributes:
      label: Checks
      description: Commands or tests that prove it works.
    validations:
      required: false
