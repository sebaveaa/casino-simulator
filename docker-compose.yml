services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: casino
      POSTGRES_PASSWORD: casino
      POSTGRES_DB: casino
    ports:
      # Loopback only: the database stays off the local network.
      # If 5432 is taken on the host, set POSTGRES_PORT in .env and match it in DATABASE_URL.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casino -d casino"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Whole stack in containers: `docker compose --profile app up --build`.
  app:
    profiles: ["app"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://casino:casino@postgres:5432/casino
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-only-not-a-real-secret-change-me
      APP_ENV: development
      PORT: "3000"
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      PROCESS_ROLE: api
    ports:
      - "127.0.0.1:3000:3000"

  # Web portal: http://localhost:8080.
  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Empty selects the in-memory mock API until the backend routes land (#9, #10, #12).
        # The browser calls the API from the host, so a real value is http://localhost:3000.
        VITE_API_URL: ""
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
